  currency: USD
  notes: >-
    Wipter has no web dashboard. Open the Wipter desktop or phone app, sign
    in, and request the payout there once the balance reaches $20. Wipter pays
    only in USDT on BNB Smart Chain (BEP20), to the wallet you set in the app's
    Payments section; there is no PayPal option.

platforms: [windows, macos, linux, android]

