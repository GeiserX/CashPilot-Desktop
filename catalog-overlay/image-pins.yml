# Desktop-only image pins.
#
# The web catalog names the image; this file names the exact build of it Desktop
# ships. Desktop's rule is that every live service pins an immutable @sha256:
# digest (internal/catalog's TestServiceImagesArePinned enforces it), while the web
# catalog mostly carries floating references, so the digest is ours to keep.
#
# Keyed by service slug. `image` must be the web entry's repository AND tag with a
# digest appended; cmd/catalogsync refuses to sync when it is not, so an upstream
# image move or tag change (proxybase -> ghcr peer-cli, urnetwork -> g4-latest)
# stops the sync instead of quietly holding Desktop on the retired build.
#
# A pin is needed only where the web entry is live and carries no digest of its
# own: proxybase and proxybase-xyz pin themselves upstream, and dead/broken/dropped
# entries are exempt because they are never deployed. The sync also fails when a
# live floating image has no pin here, so the rule cannot be dropped by omission.
#
# To re-pin after an upstream change, resolve the new digest from the registry:
#
#   docker buildx imagetools inspect <repo>:<tag> --format '{{.Manifest.Digest}}'
#
# Take the manifest-LIST digest (what that command prints), not a per-platform one:
# a single-platform digest would pull the wrong build on every other architecture.

pins:
  anyone-protocol:
    image: "ghcr.io/anyone-protocol/ator-protocol@sha256:62af1d6e0245667765f217bcce90d31c82fe687203abc66af7cf117e12581265"
    why: "Relay image; upstream ships a floating tag."
