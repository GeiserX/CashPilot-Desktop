# --- Desktop-only (catalog-overlay/append/depin/grass.yml) ------------------
# Secure VM (macOS): Grass ran signed in behind the fence in the macOS lab
# (docs/design/secure-macos-vm.md). store.json already holds an access token
# from an anonymous device login before any sign-in, so the marker is the key
# wynd:device_id, which appears only after the account signs in.
# vm_stance: no VM or VPS clause in the terms.
#   https://www.grass.io/terms-and-conditions, read 2026-11-27.
guest:
  macos:
    app: "Grass.app"
    process: "grass"
    team_id: "ZD9734TW8Q"
    download: "https://files.grass.io/file/grass-extension-upgrades/v8.1.0/Grass_8.1.0_aarch64.dmg"
    sha256: "96af231d7630ce22b66b3ded47351b9607b82305bf01c3100aaf6757759ce9e3"
    version: "8.1.0"
    signin: console
    signed_in:
      file: "io.getgrass.desktop/store.json"
      key: "wynd:device_id"
