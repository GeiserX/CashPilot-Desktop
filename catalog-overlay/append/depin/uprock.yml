# --- Desktop-only (catalog-overlay/append/depin/uprock.yml) -----------------
# Secure VM (macOS): the UpRock Mining desktop app, proven in the macOS lab
# (docs/design/secure-macos-vm.md). Intel only, so it runs under Rosetta. Its
# database is encrypted. install-app.sh makes it keep the sign-in in
# credentials.json, which gets the key "main" once an account signs in.
# vm_stance: none found; its help centre lists "Desktop (Windows, Linux and
#   MacOS)". https://uprock.com, read 2026-11-27.
guest:
  macos:
    app: "UpRock Mining.app"
    process: "uprock-mining"
    team_id: "Y46RSV89ZD"
    download: "https://edge.uprock.com/v1/app-download/UpRock-Mining-v0.0.38.dmg"
    sha256: "dc3773b88668161d60a251397e2ac5ab926541c421d80adbfe56585ef776801b"
    version: "0.0.38"
    rosetta: true
    signin: console
    signed_in:
      file: "UpRock/credentials.json"
      key: "main"
    note: "UpRock crawls web pages for other people. It needs Rosetta."
