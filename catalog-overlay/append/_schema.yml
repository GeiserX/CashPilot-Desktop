# --- Desktop-only (catalog-overlay/append/_schema.yml) -----------------------
# Everything above comes from the web catalog's schema. The block below documents
# the fields only Desktop understands.

# native:  (optional, additive — how to run this service as a supervised NATIVE child
#           process with no container runtime. A service may declare docker:, native:,
#           or both; native is preferred on hosts that have a matching binary.)
#          Desktop-only: the web app deploys through Docker on a worker and has no
#          supervised-process runtime, so it ignores this block.
#   binaries:  (one pinned download per OS/arch)
#     - os: darwin        # darwin | linux | windows (matches Go's runtime.GOOS)
#       arch: arm64       # amd64 | arm64 (matches Go's runtime.GOARCH)
#       url: "https://.../myst_darwin_arm64.tar.gz"  # MUST be HTTPS
#       sha256: "<64-hex>"  # SHA-256 of the downloaded artifact; MANDATORY. The
#                           # downloader fails closed on mismatch or a missing/invalid
#                           # value (a placeholder like "TODO-verify" never executes).
#       archive: tar.gz   # tar.gz | zip | none  (none = the url IS the raw binary)
#       bin: "myst"       # path to the executable inside the archive (e.g. "myst.exe")
#       args: ""          # optional; tokenized like command and placed BEFORE it,
#                         # for a global flag only this OS needs (e.g. "--userspace")
#       firewall_block: []  # optional, os: windows only; CIDRs an outbound Windows
#                           # Firewall rule blocks this binary from. Desktop creates
#                           # the rule (one admin prompt) before it starts the binary,
#                           # refuses to start without it, and deletes it on remove.
#   command: ""  (arg template for the binary; tokenized then ${VAR}-substituted with
#                 env, argv-only/no-shell — same safe path as docker.command)
#   env: []  (same shape as docker.env; resolved + passed to the process environment)

# guest:  (optional — marks a desktop-only app that may run inside the Secure VM,
#          docs/design/secure-windows-vm.md. Nil means the app is never offered there.)
#          Desktop-only: the web app has no Secure VM, so it ignores this block.
#          A service with requirements.container_prohibited never carries one.
#   windows:
#     process: "Wipter.exe"       # executable name the guest read matches
#     publisher: "CN=..."         # expected Authenticode subject of the official
#                                 # installer, as Windows prints it; MANDATORY
#     download_page: "https://..."  # the vendor's official page; MUST be HTTPS
#     signin: console             # console (by hand in the VM window) | none
#   macos:                        # the macOS guest (docs/design/secure-macos-vm.md)
#     app: "Wipter.app"           # the bundle the download puts in /Applications
#     process: "Wipter"           # executable name pgrep matches in the guest
#     team_id: "55Y88XCDLZ"       # expected Developer ID Team ID; MANDATORY
#     download: "https://..."     # the vendor's .dmg, .pkg or .zip; MUST be HTTPS
#     sha256: "..."               # pin, when the vendor serves a versioned file
#     version: "8.1.0"            # the pinned version, with sha256
#     rosetta: true               # Intel-only: the guest installs Rosetta first
#     signin: console             # console (by hand on the VM's screen) | none
#     signed_in:                  # how the guest read tells a signed-in app
#       file: "x/y.json"          # under the earner's ~/Library/Application Support
#       key: "..."                # ...holding this JSON key, or
#       log_words: "..."          # ...a log holding these words, or
#       process: true             # no account: running is enough
#     note: "..."                 # what the user should know before placing it
#   refused: terms | unsigned     # never in a Secure VM, and no OS block: the
#                                 # provider's terms forbid or warn against VMs,
#                                 # or its app has no developer signature
#   # vm_stance: <what the vendor says about VMs>, <URL>, read <date>  (a comment)
