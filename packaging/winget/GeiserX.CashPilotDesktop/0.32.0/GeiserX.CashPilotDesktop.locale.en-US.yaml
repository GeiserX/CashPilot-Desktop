ShortDescription: Needs Docker Desktop or Podman. Deploys and monitors passive-income and DePIN services from one app.
Description: |-
  CashPilot Desktop needs Docker Desktop or Podman installed; the earning services run as containers there, and the setup wizard helps if neither is present.
  It deploys and monitors passive-income and DePIN services from one window: live earnings, service health, container stats and node uptime. It runs either as the full CashPilot dashboard or as a Worker Node that joins an existing CashPilot instance.
