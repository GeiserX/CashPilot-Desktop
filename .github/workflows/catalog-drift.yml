name: Catalog drift

# services/ is a vendored copy of the CashPilot web catalog. This job says when the
# two have parted.
#
# It deliberately does NOT run on pull_request. A change in the web repository is not
# a reason to block an unrelated Desktop PR, and a gate that fails for something the
# author did not touch gets ignored, which is worse than no gate. Weekly, plus on
# demand, is often enough: the catalog moves in days, not minutes.
#
# No token is needed for the comparison. codeload serves public repository tarballs
# anonymously, so this works on a fork and on a public repo's ubuntu-latest runner.
#
# A red weekly run used to be the only signal, and it stayed red for two weeks with
# nobody looking. So a run against the web catalog's main (every scheduled run, and a
# dispatch left on the default ref) keeps one standing issue in step with the result:
# opened or commented on when the check fails, closed when it passes again.

on:
  schedule:
    # Mondays, 06:15 UTC.
    - cron: '15 6 * * 1'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or commit SHA of GeiserX/CashPilot to compare against'
        required: false
        default: 'main'

permissions:
  contents: read
  issues: write

concurrency:
  group: catalog-drift
  cancel-in-progress: false

jobs:
  drift:
    name: services/ vs GeiserX/CashPilot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.8'
          cache: true

      # The ref goes through the environment rather than straight into the run
      # script, so a dispatch input cannot become shell.
      #
      # catalogsync answers with three different exit codes, and they mean different
      # things: 0 agreed, 1 really drifted, 2 the comparison never happened (codeload
      # down, a ref that does not exist, an overlay that will not parse). Announcing a
      # network error as "the catalog changed" sends someone to diff files nobody
      # touched, so the drift message is printed for exit 1 and nothing else.
      - name: Compare the vendored catalog with the web catalog
        id: compare
        env:
          CATALOG_REF: ${{ inputs.ref || 'main' }}
        run: |
          set +e
          go run ./cmd/catalogsync -check -ref "$CATALOG_REF" 2>&1 | tee "$RUNNER_TEMP/catalogsync.log"
          code=${PIPESTATUS[0]}
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          case "$code" in
            0)
              exit 0
              ;;
            1)
              echo "::error::services/ no longer matches the CashPilot web catalog."
              echo "Run 'make catalog-sync' locally, review the diff, and commit it."
              echo "If a difference is deliberate, declare it in catalog-overlay/ rather"
              echo "than editing services/ by hand. See catalog-overlay/README.md."
              exit 1
              ;;
            *)
              echo "::error::catalogsync could not compare the catalogs (exit $code)."
              echo "This is a fetch, overlay or IO failure, NOT catalog drift: the"
              echo "comparison never ran. The output above says which. Re-run the job."
              exit "$code"
              ;;
          esac

      # The standing issue. It is found by its exact title among open issues, so a
      # second failure comments on the first issue instead of opening another one.
      # A compare step that never wrote its code (checkout or setup-go failed) counts
      # as a failure to compare. Only runs against the web catalog's main touch it: a
      # dispatch against another ref is an experiment, not the state of the catalog.
      - name: Keep the standing drift issue in step
        if: always() && (github.event_name == 'schedule' || inputs.ref == 'main')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CODE: ${{ steps.compare.outputs.code }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='Catalog drift: services/ no longer matches the CashPilot web catalog'
          number=$(gh issue list --state open --limit 200 --json number,title \
            | jq -r --arg t "$title" '[.[] | select(.title == $t)][0].number // empty')

          if [ "$CODE" = "0" ]; then
            if [ -n "$number" ]; then
              gh issue close "$number" --comment "The vendored catalog matches the web catalog again: $RUN_URL"
            fi
            exit 0
          fi

          {
            if [ "$CODE" = "1" ]; then
              echo "services/ no longer matches GeiserX/CashPilot@main."
              echo
              echo "Run \`make catalog-sync\`, check every referral URL and code in the diff, and open a PR. If a difference is deliberate, declare it in catalog-overlay/ instead of editing services/ by hand."
            else
              echo "The weekly check could not compare the catalogs (exit ${CODE:-none}). This is a fetch, overlay or IO failure, not drift. Re-run the workflow; if it keeps failing, the log says why."
            fi
            echo
            echo "Run: $RUN_URL"
            if [ -s "$RUNNER_TEMP/catalogsync.log" ]; then
              echo
              echo '```'
              tail -n 60 "$RUNNER_TEMP/catalogsync.log"
              echo '```'
            fi
          } > "$RUNNER_TEMP/issue.md"

          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file "$RUNNER_TEMP/issue.md"
          else
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/issue.md"
          fi
