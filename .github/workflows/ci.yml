name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The app ships on linux, macOS and windows, so it is built and tested on all
  # three. It used to be linux only, which meant every platform-shaped mistake —
  # a path joined with a slash, a socket only unix has, a file permission windows
  # ignores — was found by a user on the platform we do not develop on, after the
  # release. The end-to-end tests in e2e/ are the ones that make this matrix worth
  # paying for: they drive the real app against a fake Docker daemon and fake
  # earning platforms over loopback TCP, so each runner exercises deploy, collect,
  # convert and the worker API without a container runtime or an account.
  test:
    name: build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            race: true
            coverage: true
          - os: macos-latest
            race: true
            coverage: false
          # The race detector needs a working C toolchain, which the windows
          # runner does not guarantee. Windows still builds, vets and runs the
          # whole suite; only the race instrumentation is left to the other two.
          - os: windows-latest
            race: false
            coverage: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.11'
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Formatting is a property of the source, not of the platform, so it is
      # checked once rather than three times.
      - name: Formatting
        if: runner.os == 'Linux'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Test (race + coverage)
        if: matrix.coverage
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Test (race)
        if: matrix.race && !matrix.coverage
        run: go test -race ./...

      # On Windows, internal/winvm starts hundreds of PowerShell processes.
      # Run beside the other packages, it more than doubled the root
      # package's time and pushed it past the 10-minute test timeout, while
      # each package alone takes about 3 minutes. So it runs on its own.
      - name: Test
        if: '!matrix.race'
        shell: bash
        run: |
          go test $(go list ./... | grep -v '/internal/winvm$')
          go test ./internal/winvm/

      # The Secure VM's lab build (winvmlab) honours lab settings a product
      # build refuses; its tests prove the gate from the other side.
      - name: Test (Secure VM lab build)
        run: go test -tags winvmlab ./internal/winvm/

      - name: Upload coverage to Codecov
        if: matrix.coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.out
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  frontend:
    name: frontend (typecheck + render checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      # The frontend was built ONLY during a release, so a broken one reached
      # main and was found at tag time. Same shape as the docs site building only
      # on deploy: the gate ran after the decision it was meant to inform.
      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit -p tsconfig.json

      # Browser-free checks on the real render functions. They exist for one
      # rule above all: a platform with NO reading must render as an em dash,
      # never 0.00 -- showing zero reports a loss that did not happen, most
      # convincingly to the user whose collector is broken.
      - name: Render checks
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npx vite build

      - name: Wizard deploy checks in Chrome
        working-directory: frontend
        env:
          CHROME_BIN: google-chrome
        run: npm run test:dom

  # The Windows installer and uninstaller, end to end, on every PR: build the app
  # and its NSIS installer, install it silently, check the files, shortcuts and
  # Apps & Features entry, seed what the app itself creates, uninstall silently
  # twice (keep everything, then remove everything) and check what is gone and
  # what stays. The release runs the same script on the installer it ships.
  installer:
    name: windows installer (install + uninstall)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.11'
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # wails build skips the installer with only a warning when makensis is
      # missing, so this makes sure it is there.
      - name: Install NSIS
        shell: pwsh
        run: |
          if (Get-Command makensis.exe -CommandType Application -ErrorAction SilentlyContinue) { return }
          $nsis = Join-Path ${env:ProgramFiles(x86)} 'NSIS'
          $makensis = Join-Path $nsis 'makensis.exe'
          if (-not (Test-Path -LiteralPath $makensis -PathType Leaf)) {
            $version = '3.13'
            $filename = "nsis-$version-setup.exe"
            $url = "https://downloads.sourceforge.net/project/nsis/NSIS%203/$version/$filename"
            $installer = Join-Path $env:RUNNER_TEMP $filename
            $expectedHash = 'db9a1038bbc0e53fef24f423fd609979bd578e942f1be1198db186d1c42652a3'

            curl.exe --fail --silent --show-error --location --proto-redir '=https' `
              --retry 3 --retry-all-errors --connect-timeout 15 --max-time 60 --output $installer $url
            if ($LASTEXITCODE -ne 0) { throw "NSIS $version download failed (curl exit code $LASTEXITCODE)" }

            $actualHash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash
            if ($actualHash -ne $expectedHash) { throw "NSIS $version SHA-256 mismatch: expected $expectedHash, got $actualHash" }

            $setup = Start-Process -FilePath $installer -ArgumentList '/S' -Wait -PassThru
            if ($setup.ExitCode -ne 0) { throw "NSIS $version setup failed (exit code $($setup.ExitCode))" }
          }
          if (-not (Test-Path -LiteralPath $makensis -PathType Leaf)) { throw "makensis.exe is not in $nsis" }
          Add-Content -Path $env:GITHUB_PATH -Value $nsis

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build the app and its installer
        shell: bash
        run: go run github.com/wailsapp/wails/v2/cmd/wails@v2.12.0 build -clean -nsis

      - name: Install, uninstall and check
        shell: pwsh
        run: ./scripts/windows-installer-check.ps1 -Installer "build/bin/CashPilot-Desktop-setup.exe"

  # Dependency vulnerability scan (govulncheck). This is a hard gate. It was
  # advisory for as long as the tree carried github.com/docker/docker, whose daemon
  # CVEs are unfixable on that module path — see docs/SECURITY-NOTES.md. The Docker
  # calls now go through github.com/moby/moby/client, which carries no daemon code,
  # so the scan is clean and a finding that our code can reach should fail the build.
  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.11'
          cache: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...
