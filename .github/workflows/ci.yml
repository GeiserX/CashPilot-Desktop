name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The app ships on linux, macOS and windows, so it is built and tested on all
  # three. It used to be linux only, which meant every platform-shaped mistake —
  # a path joined with a slash, a socket only unix has, a file permission windows
  # ignores — was found by a user on the platform we do not develop on, after the
  # release. The end-to-end tests in e2e/ are the ones that make this matrix worth
  # paying for: they drive the real app against a fake Docker daemon and fake
  # earning platforms over loopback TCP, so each runner exercises deploy, collect,
  # convert and the worker API without a container runtime or an account.
  test:
    name: build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            race: true
            coverage: true
          - os: macos-latest
            race: true
            coverage: false
          # The race detector needs a working C toolchain, which the windows
          # runner does not guarantee. Windows still builds, vets and runs the
          # whole suite; only the race instrumentation is left to the other two.
          - os: windows-latest
            race: false
            coverage: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.11'
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Formatting is a property of the source, not of the platform, so it is
      # checked once rather than three times.
      - name: Formatting
        if: runner.os == 'Linux'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Test (race + coverage)
        if: matrix.coverage
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Test (race)
        if: matrix.race && !matrix.coverage
        run: go test -race ./...

      - name: Test
        if: '!matrix.race'
        run: go test ./...

      - name: Upload coverage to Codecov
        if: matrix.coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.out
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  frontend:
    name: frontend (typecheck + render checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      # The frontend was built ONLY during a release, so a broken one reached
      # main and was found at tag time. Same shape as the docs site building only
      # on deploy: the gate ran after the decision it was meant to inform.
      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit -p tsconfig.json

      # Browser-free checks on the real render functions. They exist for one
      # rule above all: a platform with NO reading must render as an em dash,
      # never 0.00 -- showing zero reports a loss that did not happen, most
      # convincingly to the user whose collector is broken.
      - name: Render checks
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npx vite build

      - name: Wizard deploy checks in Chrome
        working-directory: frontend
        env:
          CHROME_BIN: google-chrome
        run: npm run test:dom

  # The Windows installer and uninstaller, end to end, on every PR: build the app
  # and its NSIS installer, install it silently, check the files, shortcuts and
  # Apps & Features entry, seed what the app itself creates, uninstall silently
  # twice (keep everything, then remove everything) and check what is gone and
  # what stays. The release runs the same script on the installer it ships.
  installer:
    name: windows installer (install + uninstall)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.11'
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # wails build skips the installer with only a warning when makensis is
      # missing, so this makes sure it is there.
      - name: Install NSIS
        shell: pwsh
        run: |
          $nsis = Join-Path ${env:ProgramFiles(x86)} 'NSIS'
          if (-not (Test-Path (Join-Path $nsis 'makensis.exe'))) { choco install nsis -y --no-progress }
          if (-not (Test-Path (Join-Path $nsis 'makensis.exe'))) { Write-Error "makensis.exe is not in $nsis"; exit 1 }
          Add-Content -Path $env:GITHUB_PATH -Value $nsis

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build the app and its installer
        shell: bash
        run: go run github.com/wailsapp/wails/v2/cmd/wails@v2.12.0 build -clean -nsis

      - name: Install, uninstall and check
        shell: pwsh
        run: ./scripts/windows-installer-check.ps1 -Installer "build/bin/CashPilot-Desktop-setup.exe"

  # Dependency vulnerability scan (govulncheck). This is a hard gate. It was
  # advisory for as long as the tree carried github.com/docker/docker, whose daemon
  # CVEs are unfixable on that module path — see docs/SECURITY-NOTES.md. The Docker
  # calls now go through github.com/moby/moby/client, which carries no daemon code,
  # so the scan is clean and a finding that our code can reach should fail the build.
  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.11'
          cache: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...
