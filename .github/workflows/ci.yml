name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build + test (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.8'
          cache: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test (race + coverage)
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.out
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  frontend:
    name: frontend (typecheck + render checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      # The frontend was built ONLY during a release, so a broken one reached
      # main and was found at tag time. Same shape as the docs site building only
      # on deploy: the gate ran after the decision it was meant to inform.
      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit -p tsconfig.json

      # Browser-free checks on the real render functions. They exist for one
      # rule above all: a platform with NO reading must render as an em dash,
      # never 0.00 -- showing zero reports a loss that did not happen, most
      # convincingly to the user whose collector is broken.
      - name: Render checks
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npx vite build

  # Dependency vulnerability scan (govulncheck). This is a hard gate. It was
  # advisory for as long as the tree carried github.com/docker/docker, whose daemon
  # CVEs are unfixable on that module path — see docs/SECURITY-NOTES.md. The Docker
  # calls now go through github.com/moby/moby/client, which carries no daemon code,
  # so the scan is clean and a finding that our code can reach should fail the build.
  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.8'
          cache: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...
