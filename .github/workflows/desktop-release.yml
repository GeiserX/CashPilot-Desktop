name: Release Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_call:
    inputs:
      version:
        description: 'Version tag to build and release (e.g. v1.2.3)'
        type: string
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            platform: darwin-arm64
          - runner: ubuntu-latest
            platform: linux-amd64
          - runner: windows-latest
            platform: windows-amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.11'
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Install Wails 2.x
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev nsis

      # The Windows installer is built with NSIS. wails build skips it with only a
      # warning when makensis is missing, so make sure it is on PATH here, and the
      # packaging step fails when the installer is not there.
      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $nsis = Join-Path ${env:ProgramFiles(x86)} 'NSIS'
          if (-not (Test-Path (Join-Path $nsis 'makensis.exe'))) { choco install nsis -y --no-progress }
          if (-not (Test-Path (Join-Path $nsis 'makensis.exe'))) { Write-Error "makensis.exe is not in $nsis"; exit 1 }
          Add-Content -Path $env:GITHUB_PATH -Value $nsis

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Stamp the release version from the tag so the built artifact always matches it.
      # wails.json's productVersion previously drifted (nothing read or synced it); the
      # tag is now the single source of truth and is injected here at build time.
      - name: Set release version
        shell: bash
        run: |
          VERSION="${{ inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"
          echo "Building version $VERSION"
          # Also hand it to the Go linker. wails.json's productVersion is read by
          # the installer, NOT by the running binary -- so without this the app
          # cannot report its own version and a paired Desktop shows as "unknown"
          # on the fleet page forever, which is how a stale install stays
          # invisible. Same single source of truth: the tag.
          echo "CASHPILOT_LDFLAGS=-X main.appVersion=$VERSION" >> "$GITHUB_ENV"
          tmp=$(mktemp)
          jq --arg v "$VERSION" '.info.productVersion = $v' wails.json > "$tmp" && mv "$tmp" wails.json
          for f in package.json frontend/package.json; do
            tmp=$(mktemp)
            jq --arg v "$VERSION" '.version = $v' "$f" > "$tmp" && mv "$tmp" "$f"
          done

      - name: Test
        run: go test ./...

      - name: Build Wails app (Linux)
        if: runner.os == 'Linux'
        run: go run github.com/wailsapp/wails/v2/cmd/wails@v2.12.0 build -clean -tags webkit2_41 -ldflags "$CASHPILOT_LDFLAGS"

      - name: Build Wails app (macOS)
        if: runner.os == 'macOS'
        run: go run github.com/wailsapp/wails/v2/cmd/wails@v2.12.0 build -clean -ldflags "$CASHPILOT_LDFLAGS"

      # -nsis also builds the installer, build/bin/CashPilot-Desktop-setup.exe,
      # from build/windows/installer/project.nsi.
      - name: Build Wails app and installer (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: go run github.com/wailsapp/wails/v2/cmd/wails@v2.12.0 build -clean -nsis -ldflags "$CASHPILOT_LDFLAGS"

      # Sign with the Developer ID certificate under the hardened runtime, notarize and
      # staple, so Gatekeeper opens the app instead of calling it damaged. A missing
      # secret fails the job: a macOS release must never go out unsigned without anyone
      # noticing. `stapler` and `spctl` are the real gate, since they fail when Apple
      # did not issue a notarization ticket.
      - name: Sign and notarize (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!v}" ] || { echo "::error::secret $v is not set; refusing to ship an unsigned macOS build"; exit 1; }
          done
          app="$(find build/bin -maxdepth 1 -name '*.app' | head -1)"
          test -n "$app" || { echo "no .app bundle found in build/bin"; ls -la build/bin; exit 1; }

          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_pass="$(openssl rand -hex 16)"
          security create-keychain -p "$keychain_pass" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_pass" "$keychain"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_pass" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain"

          codesign --force --options runtime --timestamp --keychain "$keychain" --sign "$APPLE_SIGNING_IDENTITY" "$app"
          codesign --verify --strict --verbose=2 "$app"

          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$app"
          spctl --assess --type execute --verbose=2 "$app"

          security delete-keychain "$keychain"

      - name: Sign Windows binaries
        if: runner.os == 'Windows'
        env:
          WINDOWS_SIGN_CERT: ${{ secrets.WINDOWS_SIGN_CERT }}
          WINDOWS_SIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERT_PASSWORD }}
        run: |
          # `secrets` is not allowed in a step `if:` (it makes GitHub reject the whole
          # workflow at startup), so gate on the secret here in the run body instead.
          if ([string]::IsNullOrEmpty($env:WINDOWS_SIGN_CERT)) {
            Write-Host "WINDOWS_SIGN_CERT not configured — skipping code signing"
            exit 0
          }
          $cert = [System.Convert]::FromBase64String($env:WINDOWS_SIGN_CERT)
          [System.IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", $cert)
          function Sign([string] $file) {
            & signtool sign /f "$env:RUNNER_TEMP\cert.pfx" /p "$env:WINDOWS_SIGN_CERT_PASSWORD" /tr http://timestamp.digicert.com /td sha256 /fd sha256 $file
            if ($LASTEXITCODE -ne 0) { throw "signtool failed on $file" }
          }
          # The installer carries a copy of the exe, so the exe is signed first and
          # the installer is built again around the signed exe, then signed itself.
          $exe = (Resolve-Path "build\bin\CashPilot Desktop.exe").Path
          Sign $exe
          Push-Location build\windows\installer
          & makensis "-DARG_WAILS_AMD64_BINARY=$exe" project.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed" }
          Pop-Location
          Sign (Resolve-Path "build\bin\CashPilot-Desktop-setup.exe").Path
          Remove-Item "$env:RUNNER_TEMP\cert.pfx"
        shell: pwsh

      # Package each platform into a uniquely named, uploadable asset. The macOS
      # output is a `.app` bundle (a directory) that cannot be a release asset on
      # its own, and the bare Linux/Windows binaries share the base name
      # "CashPilot Desktop" — so without per-platform packaging the release ends up
      # with a collision/missing binary (only Windows survived cleanly before).
      - name: Package release asset (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          tar -czf "dist/CashPilot-Desktop-${{ matrix.platform }}.tar.gz" -C build/bin "CashPilot Desktop"

      - name: Package release asset (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          app="$(find build/bin -maxdepth 1 -name '*.app' | head -1)"
          test -n "$app" || { echo "no .app bundle found in build/bin"; ls -la build/bin; exit 1; }
          ditto -c -k --keepParent "$app" "dist/CashPilot-Desktop-${{ matrix.platform }}.zip"

      # The installer, then the portable exe. The portable exe costs nothing to
      # keep: it is the file the installer installs.
      - name: Package release asset (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          if (-not (Test-Path "build\bin\CashPilot-Desktop-setup.exe")) { Write-Error "wails build made no installer (is makensis on PATH?)"; exit 1 }
          Copy-Item "build\bin\CashPilot-Desktop-setup.exe" "dist\CashPilot-Desktop-${{ matrix.platform }}-setup.exe"
          Copy-Item "build\bin\CashPilot Desktop.exe" "dist\CashPilot-Desktop-${{ matrix.platform }}.exe"
        shell: pwsh

      # Install, uninstall and check, on the exact installer this release ships
      # (scripts/windows-installer-check.ps1).
      - name: Check the installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/windows-installer-check.ps1 -Installer "dist/CashPilot-Desktop-${{ matrix.platform }}-setup.exe"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write      # signs the build provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The release notes list the commits since the last tag.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.11'
          cache: false

      - uses: actions/download-artifact@v8
        with:
          path: artifacts/

      # A checksum file and a signed build provenance attestation, so a user can
      # check that the file they downloaded is the one this workflow built:
      #   sha256sum -c SHA256SUMS --ignore-missing
      #   gh attestation verify <file> -R GeiserX/CashPilot-Desktop
      - name: Write SHA256SUMS
        working-directory: artifacts
        run: |
          set -euo pipefail
          for f in desktop-*/*; do
            (cd "$(dirname "$f")" && sha256sum "$(basename "$f")")
          done > SHA256SUMS
          cat SHA256SUMS
          test -s SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/desktop-*/*

      # The release notes are written for people who install the app: which file
      # to take, the two Windows warnings and what to click, then only the changes a
      # user can reach, and every commit last in a collapsed block
      # (cmd/releasenotes). GitHub's generated notes were the commit list alone.
      # The build signs the Windows files exactly when WINDOWS_SIGN_CERT is set (it
      # fails the job if signtool fails), so the notes explain the unsigned-file
      # warnings only when that secret is missing.
      - name: Write the release notes
        env:
          TAG: ${{ inputs.version || github.ref_name }}
          WINDOWS_SIGNED: ${{ secrets.WINDOWS_SIGN_CERT != '' }}
        run: |
          set -euo pipefail
          go run ./cmd/releasenotes -tag "$TAG" -repo "$GITHUB_REPOSITORY" -windows-signed="$WINDOWS_SIGNED" artifacts/desktop-*/* artifacts/SHA256SUMS > "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md"
          test -s "$RUNNER_TEMP/release-notes.md"

      # The tag is created HERE, with the release, and only after every platform
      # built and passed its tests. auto-tag used to push the tag first, so a
      # failed build left a version tag with no release behind it. For a
      # hand-pushed tag the tag already exists and target_commitish is ignored.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: |
            artifacts/desktop-*/*
            artifacts/SHA256SUMS
          body_path: ${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The release page shows each file under a name that says what it is.
      # packaging/packaging_test.go checks that every published file has a label here.
      - name: Label the release files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          labels='CashPilot-Desktop-windows-amd64-setup.exe|CashPilot Desktop for Windows (installer, x64)
          CashPilot-Desktop-windows-amd64.exe|CashPilot Desktop for Windows (portable, x64)
          CashPilot-Desktop-darwin-arm64.zip|CashPilot Desktop for macOS (Apple silicon)
          CashPilot-Desktop-linux-amd64.tar.gz|CashPilot Desktop for Linux (x64)
          SHA256SUMS|SHA256SUMS (checksums of every file)'
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets[] | "\(.id) \(.name)"' > assets.txt
          test -s assets.txt
          while read -r id name; do
            label="$(printf '%s\n' "$labels" | sed 's/^ *//' | awk -F'|' -v n="$name" '$1 == n { print $2 }')"
            if [ -z "$label" ]; then echo "::error::no label for release file $name"; exit 1; fi
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$id" -f label="$label" --jq '"\(.name) -> \(.label)"'
          done < assets.txt
