name: Release Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_call:
    inputs:
      version:
        description: 'Version tag to build and release (e.g. v1.2.3)'
        type: string
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            platform: darwin-arm64
          - runner: ubuntu-latest
            platform: linux-amd64
          - runner: windows-latest
            platform: windows-amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.8'
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Install Wails 2.x
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev nsis

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Stamp the release version from the tag so the built artifact always matches it.
      # wails.json's productVersion previously drifted (nothing read or synced it); the
      # tag is now the single source of truth and is injected here at build time.
      - name: Set release version
        shell: bash
        run: |
          VERSION="${{ inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"
          echo "Building version $VERSION"
          # Also hand it to the Go linker. wails.json's productVersion is read by
          # the installer, NOT by the running binary -- so without this the app
          # cannot report its own version and a paired Desktop shows as "unknown"
          # on the fleet page forever, which is how a stale install stays
          # invisible. Same single source of truth: the tag.
          echo "CASHPILOT_LDFLAGS=-X main.appVersion=$VERSION" >> "$GITHUB_ENV"
          tmp=$(mktemp)
          jq --arg v "$VERSION" '.info.productVersion = $v' wails.json > "$tmp" && mv "$tmp" wails.json
          for f in package.json frontend/package.json; do
            tmp=$(mktemp)
            jq --arg v "$VERSION" '.version = $v' "$f" > "$tmp" && mv "$tmp" "$f"
          done

      - name: Test
        run: go test ./...

      - name: Build Wails app (Linux)
        if: runner.os == 'Linux'
        run: go run github.com/wailsapp/wails/v2/cmd/wails@v2.12.0 build -clean -tags webkit2_41 -ldflags "$CASHPILOT_LDFLAGS"

      - name: Build Wails app
        if: runner.os != 'Linux'
        run: go run github.com/wailsapp/wails/v2/cmd/wails@v2.12.0 build -clean -ldflags "$CASHPILOT_LDFLAGS"

      # Sign with the Developer ID certificate under the hardened runtime, notarize and
      # staple, so Gatekeeper opens the app instead of calling it damaged. A missing
      # secret fails the job: a macOS release must never go out unsigned without anyone
      # noticing. `stapler` and `spctl` are the real gate, since they fail when Apple
      # did not issue a notarization ticket.
      - name: Sign and notarize (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!v}" ] || { echo "::error::secret $v is not set; refusing to ship an unsigned macOS build"; exit 1; }
          done
          app="$(find build/bin -maxdepth 1 -name '*.app' | head -1)"
          test -n "$app" || { echo "no .app bundle found in build/bin"; ls -la build/bin; exit 1; }

          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_pass="$(openssl rand -hex 16)"
          security create-keychain -p "$keychain_pass" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_pass" "$keychain"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_pass" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain"

          codesign --force --options runtime --timestamp --keychain "$keychain" --sign "$APPLE_SIGNING_IDENTITY" "$app"
          codesign --verify --strict --verbose=2 "$app"

          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$app"
          spctl --assess --type execute --verbose=2 "$app"

          security delete-keychain "$keychain"

      - name: Sign Windows binaries
        if: runner.os == 'Windows'
        env:
          WINDOWS_SIGN_CERT: ${{ secrets.WINDOWS_SIGN_CERT }}
          WINDOWS_SIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERT_PASSWORD }}
        run: |
          # `secrets` is not allowed in a step `if:` (it makes GitHub reject the whole
          # workflow at startup), so gate on the secret here in the run body instead.
          if ([string]::IsNullOrEmpty($env:WINDOWS_SIGN_CERT)) {
            Write-Host "WINDOWS_SIGN_CERT not configured — skipping code signing"
            exit 0
          }
          $cert = [System.Convert]::FromBase64String($env:WINDOWS_SIGN_CERT)
          [System.IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", $cert)
          Get-ChildItem -Recurse "build\bin" -Include "*.exe" | ForEach-Object {
            & signtool sign /f "$env:RUNNER_TEMP\cert.pfx" /p "$env:WINDOWS_SIGN_CERT_PASSWORD" /tr http://timestamp.digicert.com /td sha256 /fd sha256 $_.FullName
          }
          Remove-Item "$env:RUNNER_TEMP\cert.pfx"
        shell: pwsh

      # Package each platform into a uniquely named, uploadable asset. The macOS
      # output is a `.app` bundle (a directory) that cannot be a release asset on
      # its own, and the bare Linux/Windows binaries share the base name
      # "CashPilot Desktop" — so without per-platform packaging the release ends up
      # with a collision/missing binary (only Windows survived cleanly before).
      - name: Package release asset (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          tar -czf "dist/CashPilot-Desktop-${{ matrix.platform }}.tar.gz" -C build/bin "CashPilot Desktop"

      - name: Package release asset (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          app="$(find build/bin -maxdepth 1 -name '*.app' | head -1)"
          test -n "$app" || { echo "no .app bundle found in build/bin"; ls -la build/bin; exit 1; }
          ditto -c -k --keepParent "$app" "dist/CashPilot-Desktop-${{ matrix.platform }}.zip"

      - name: Package release asset (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "build\bin\CashPilot Desktop.exe" "dist\CashPilot-Desktop-${{ matrix.platform }}.exe"
        shell: pwsh

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          files: artifacts/desktop-*/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
