name: Auto Tag

# One release a day at most (the CashPilot web repo does the same). A release used to
# be cut on every merge that touched the app, which on a busy day was four or more
# version bumps, each one an update notice for everyone who runs the app. Merges now
# collect on main and the daily run releases them together: it computes the next semver
# from the commits since the last tag, creates + pushes the tag, then CALLS
# desktop-release.yml as a reusable workflow to build and publish. On a day when no file
# the app is built from changed since the last tag, it tags nothing.
# An urgent fix does not wait: start this workflow by hand (Actions, "Auto Tag",
# "Run workflow"), which releases main as it is.
#
# The reusable-call is deliberate: a tag pushed with the default GITHUB_TOKEN does NOT
# trigger another workflow (GitHub's loop-prevention), so relying on desktop-release.yml's
# own `push: tags` trigger here would silently never build. Calling it directly (like the
# web repo calls build.yml) sidesteps that. A human pushing a tag by hand still triggers
# desktop-release.yml through its tag trigger, unchanged.

on:
  schedule:
    - cron: '47 3 * * *'  # 03:47 UTC, every day
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Serialize so a daily run and a hand-started one can't race on creating the same next tag.
  group: auto-tag
  cancel-in-progress: false

jobs:
  tag:
    name: Bump version and tag
    runs-on: ubuntu-latest
    # main only. "Run workflow" offers every branch, and a run from another one
    # would tag and publish code that is not merged.
    if: github.ref == 'refs/heads/main'
    outputs:
      new_tag: ${{ steps.version.outputs.new_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        run: |
          LATEST=$(git tag -l 'v*.*.*' --sort=-v:refname | head -1)
          if [ -z "$LATEST" ]; then
            LATEST="v0.0.0"
          fi

          # Nothing to release: no file the app is built from changed since the last
          # tag. Without this the daily run would bump the version every day.
          if [ "$LATEST" != "v0.0.0" ]; then
            CHANGED=$(git diff --name-only "$LATEST"..HEAD -- \
              '*.go' internal frontend services go.mod go.sum wails.json \
              build trayicons packaging catalog-overlay)
            if [ -z "$CHANGED" ]; then
              echo "Nothing the app is built from changed since $LATEST; no release."
              exit 0
            fi
            echo "Changed since $LATEST:"; echo "$CHANGED"
          fi

          VERSION="${LATEST#v}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)

          # Bump from conventional-commit markers in the commits since the last tag:
          # a "BREAKING CHANGE" footer or a "type!:" subject -> major; a "feat:" -> minor;
          # otherwise patch. Fully automated — no manual tags.
          if [ "$LATEST" = "v0.0.0" ]; then
            RANGE="HEAD"
          else
            RANGE="${LATEST}..HEAD"
          fi
          LOG=$(git log --format='%s%n%b' "$RANGE")
          if echo "$LOG" | grep -qE '^BREAKING CHANGE:|^[a-z]+(\([^)]*\))?!:'; then
            MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
            LEVEL="major"
          elif echo "$LOG" | grep -qE '^feat(\([^)]*\))?:'; then
            MINOR=$((MINOR + 1)); PATCH=0
            LEVEL="minor"
          else
            PATCH=$((PATCH + 1))
            LEVEL="patch"
          fi
          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "Bumping $LATEST -> $NEW_TAG ($LEVEL)"

      - name: Create and push tag
        if: steps.version.outputs.new_tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.new_tag }}" -m "Release ${{ steps.version.outputs.new_tag }}"
          git push origin "${{ steps.version.outputs.new_tag }}"

  release:
    needs: tag
    if: needs.tag.outputs.new_tag
    uses: ./.github/workflows/desktop-release.yml
    with:
      version: ${{ needs.tag.outputs.new_tag }}
    secrets: inherit
