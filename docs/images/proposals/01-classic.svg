    <circle cx="650" cy="108" r="0.6" opacity="0.3"/><circle cx="1150" cy="100" r="0.7" opacity="0.3"/>
  </g>

  <!-- Sun — vertically centered at y=150 -->
  <circle cx="900" cy="150" r="80" fill="url(#sun)" opacity="0.8"/>
